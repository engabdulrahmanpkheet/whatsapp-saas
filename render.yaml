services:
  - type: web
    name: whatsapp-saas-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false       # set in Render dashboard (Atlas connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ADMIN_JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false       # set to your admin dashboard URL(s)
      - key: DEFAULT_MIN_DELAY_SEC
        value: "8"
      - key: DEFAULT_MAX_DELAY_SEC
        value: "20"
      - key: HARD_MIN_DELAY_SEC
        value: "5"
